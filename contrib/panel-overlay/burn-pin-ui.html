<!-- burn-pin-ui v2 -->
<script>
(() => {
  'use strict';
  const API = '/v0/management';
  const DURATIONS = [
    { label: '30 minutes', seconds: 1800 },
    { label: '1 hour', seconds: 3600 },
    { label: '2 hours', seconds: 7200 },
    { label: '3 hours', seconds: 10800 },
    { label: 'Until next 5h reset', until: 'five-hour-reset' },
    { label: 'Until next weekly reset', until: 'weekly-reset' },
    { label: 'Indefinite', seconds: 0 },
  ];
  let authHeader = '';
  let auths = [];
  let pins = [];

  // Capture the management key from the panel's own API calls (fetch + XHR),
  // so this overlay works regardless of how the panel stores it.
  const origFetch = window.fetch.bind(window);
  const readAuth = (h) => {
    if (!h) return '';
    try {
      if (typeof Headers !== 'undefined' && h instanceof Headers) return h.get('authorization') || '';
      if (Array.isArray(h)) { for (const [k, v] of h) if (/^authorization$/i.test(k)) return v; return ''; }
      for (const k in h) if (/^authorization$/i.test(k)) return h[k];
    } catch (e) {}
    return '';
  };
  window.fetch = (input, init) => {
    try {
      const url = typeof input === 'string' ? input : ((input && input.url) || '');
      if (url.indexOf('/v0/management') !== -1) {
        const v = readAuth(init && init.headers) || readAuth(input && input.headers);
        if (v) authHeader = v;
      }
    } catch (e) {}
    return origFetch(input, init);
  };
  const origSetHeader = XMLHttpRequest.prototype.setRequestHeader;
  XMLHttpRequest.prototype.setRequestHeader = function (name, value) {
    if (/^authorization$/i.test(name) && value) authHeader = value;
    return origSetHeader.call(this, name, value);
  };

  const call = (method, path, body) => origFetch(API + path, {
    method,
    headers: Object.assign({ Authorization: authHeader }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });

  async function refresh() {
    if (!authHeader) return;
    try {
      const [pinsRes, authsRes] = await Promise.all([call('GET', '/burn-pins'), call('GET', '/auth-files')]);
      if (pinsRes.ok) pins = ((await pinsRes.json()).pins) || [];
      if (authsRes.ok) auths = ((await authsRes.json()).files) || [];
      renderBadge();
    } catch (e) {}
  }

  // ---------- transient error toast ----------
  let toastEl = null;
  let toastTimer = 0;
  const toast = (message) => {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:fixed;right:14px;bottom:64px;z-index:2147483002;background:rgba(60,16,16,.95);color:#ffb4b4;border:1px solid #a33;border-radius:8px;padding:8px 12px;font:12px/1.5 system-ui,sans-serif;max-width:320px;box-shadow:0 2px 10px rgba(0,0,0,.4);';
      (document.body || document.documentElement).appendChild(toastEl);
    }
    toastEl.textContent = message;
    toastEl.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, 6000);
  };

  // ---------- status badge ----------
  const badge = document.createElement('div');
  badge.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:2147483000;display:none;flex-direction:column;gap:6px;font:12px/1.5 system-ui,sans-serif;';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(badge));
  if (document.body) document.body.appendChild(badge);

  const fmtRemaining = (pin) => {
    if (pin.indefinite) return '∞';
    const end = Date.parse(pin.expires_at || '');
    if (!end) return '';
    let s = Math.max(0, Math.round((end - Date.now()) / 1000));
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    return h > 0 ? h + 'h ' + m + 'm' : (m > 0 ? m + 'm ' + s + 's' : s + 's');
  };

  function renderBadge() {
    badge.innerHTML = '';
    badge.style.display = pins.length ? 'flex' : 'none';
    for (const pin of pins) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;background:rgba(20,20,24,.92);color:#ffd9a0;border:1px solid #ff8c00;border-radius:8px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.4);';
      const name = String(pin.name || '').replace(/\.json$/, '');
      const label = document.createElement('span');
      const modeHint = pin.mode === 'five-hour-reset' ? ' until 5h reset' : pin.mode === 'weekly-reset' ? ' until weekly reset' : '';
      label.textContent = '🔥 Burning ' + name + ' (' + pin.provider + ') · ' + fmtRemaining(pin) + modeHint;
      const stop = document.createElement('button');
      stop.textContent = '×';
      stop.title = 'Stop burning';
      stop.style.cssText = 'all:unset;cursor:pointer;color:#ff8c00;font-size:14px;padding:0 2px;';
      stop.onclick = async () => {
        // Fall back to provider-keyed delete for pins whose credential no longer resolves.
        const q = pin.auth_index ? 'auth_index=' + encodeURIComponent(pin.auth_index) : 'provider=' + encodeURIComponent(pin.provider || '');
        await call('DELETE', '/burn-pins?' + q);
        refresh();
      };
      row.appendChild(label); row.appendChild(stop);
      badge.appendChild(row);
    }
  }
  setInterval(renderBadge, 1000);
  setInterval(refresh, 5000);
  setTimeout(refresh, 1500);

  // ---------- right-click menu ----------
  let menu = null;
  const closeMenu = () => { if (menu) { menu.remove(); menu = null; } };
  document.addEventListener('click', closeMenu, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); }, true);

  function findAuthAt(el) {
    let node = el;
    for (let depth = 0; node && node !== document.body && depth < 8; depth++, node = node.parentElement) {
      const text = (node.innerText || '').slice(0, 3000);
      if (!text) continue;
      const matches = auths.filter((a) => a.name && text.indexOf(a.name) !== -1);
      if (matches.length === 1) return matches[0];
      if (matches.length > 1) return null; // ambiguous container (whole list)
    }
    return null;
  }

  document.addEventListener('contextmenu', (e) => {
    if (!auths.length || !authHeader) return;
    const hit = findAuthAt(e.target);
    if (!hit) return;
    e.preventDefault();
    e.stopPropagation();
    closeMenu();
    menu = document.createElement('div');
    menu.style.cssText = 'position:fixed;z-index:2147483001;min-width:200px;background:rgba(24,24,28,.97);color:#eee;border:1px solid #444;border-radius:8px;padding:6px 0;font:13px/1.6 system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.5);';
    const title = document.createElement('div');
    title.textContent = String(hit.name || '').replace(/\.json$/, '');
    title.style.cssText = 'padding:4px 12px;color:#999;font-size:11px;border-bottom:1px solid #333;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;';
    menu.appendChild(title);
    const header = document.createElement('div');
    header.textContent = '🔥 Only burn this account';
    header.style.cssText = 'padding:4px 12px;color:#ffb45e;font-weight:600;';
    menu.appendChild(header);
    for (const d of DURATIONS) {
      const item = document.createElement('div');
      item.textContent = d.label;
      item.style.cssText = 'padding:4px 24px;cursor:pointer;';
      item.onmouseenter = () => (item.style.background = '#333');
      item.onmouseleave = () => (item.style.background = '');
      item.onclick = async () => {
        closeMenu();
        const body = d.until
          ? { auth_index: hit.auth_index, until: d.until }
          : { auth_index: hit.auth_index, duration_seconds: d.seconds };
        try {
          const res = await call('POST', '/burn-pins', body);
          if (!res.ok) {
            let message = 'burn pin failed (' + res.status + ')';
            try { message = (await res.json()).error || message; } catch (e) {}
            toast(message);
          }
        } catch (e) {
          toast('burn pin request failed');
        }
        refresh();
      };
      menu.appendChild(item);
    }
    if (pins.some((p) => p.auth_index === hit.auth_index)) {
      const stop = document.createElement('div');
      stop.textContent = 'Stop burning';
      stop.style.cssText = 'padding:4px 12px;cursor:pointer;color:#f66;border-top:1px solid #333;margin-top:4px;';
      stop.onmouseenter = () => (stop.style.background = '#333');
      stop.onmouseleave = () => (stop.style.background = '');
      stop.onclick = async () => {
        closeMenu();
        await call('DELETE', '/burn-pins?auth_index=' + encodeURIComponent(hit.auth_index || ''));
        refresh();
      };
      menu.appendChild(stop);
    }
    document.body.appendChild(menu);
    const rect = menu.getBoundingClientRect();
    menu.style.left = Math.min(e.clientX, window.innerWidth - rect.width - 8) + 'px';
    menu.style.top = Math.min(e.clientY, window.innerHeight - rect.height - 8) + 'px';
  }, true);
})();
</script>
